name: Android CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 러너에는 Android SDK가 미리 설치돼 있어요(ANDROID_HOME).
      # setup-android 액션이 더 이상 없는 'tools' 패키지를 받으려다 실패하므로 쓰지 않습니다.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: labbit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
